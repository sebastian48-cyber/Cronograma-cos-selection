<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronograma COS Selection 2026 · Dashboard Ejecutivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fb; --panel:#ffffff; --line:#e2e8f0; --txt:#1e293b; --mut:#64748b;
    --lw: clamp(260px, 22vw, 440px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at top right,#ffffff,#f4f7fb 70%);
    color:var(--txt); font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  .wrap{ width:100%; max-width:100%; margin:0; padding:32px clamp(16px,2vw,40px) 80px; }

  header{margin-bottom:28px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;}
  header h1{font-size:1.8rem; font-weight:800; margin:0 0 6px; letter-spacing:-.5px; color:#0f172a;}
  header p{color:var(--mut); margin:0; font-size:1rem; font-weight:500;}

  .kpis{display:flex; gap:16px; flex-wrap:wrap; margin:20px 0 28px;}
  .kpi{flex:1; min-width:160px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
       box-shadow:0 4px 15px rgba(0,0,0,.03); transition:transform .2s ease, box-shadow .2s;}
  .kpi:hover{transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,0,0,.06);}
  .kpi .v{font-size:1.8rem; font-weight:800; line-height:1.2; margin-bottom:4px; color:#0f172a;}
  .kpi .l{color:var(--mut); font-size:.8rem; text-transform:uppercase; letter-spacing:.8px; font-weight:600;}
  .kpi.dl{border-top:4px solid #ef4444;}
  .kpi.dl .v{color:#ef4444;}

  .legend{display:flex; gap:12px; flex-wrap:wrap; margin:0 0 22px; font-size:.85rem; font-weight:600; align-items:center;}
  .leg{display:flex; align-items:center; gap:8px; padding:6px 14px; background:var(--panel); border-radius:20px;
       border:1px solid var(--line); cursor:pointer; transition:all .3s cubic-bezier(.4,0,.2,1); box-shadow:0 2px 5px rgba(0,0,0,.02);}
  .leg:hover{background:#f8fafc; transform:translateY(-1px); box-shadow:0 4px 8px rgba(0,0,0,.05);}
  .leg i{width:12px; height:12px; border-radius:50%; display:inline-block;}
  #resetBtn{display:none; cursor:pointer; padding:6px 14px; background:#0f172a; border-radius:20px; font-weight:600;
             color:#fff; transition:background .2s; margin-left:auto; box-shadow:0 4px 10px rgba(15,23,42,.2);}
  #resetBtn:hover{background:#1e293b; transform:translateY(-1px);}

  .chart{--z-off:0; --z-scale:1; background:var(--panel); border:1px solid var(--line); border-radius:20px;
          padding:0; box-shadow:0 10px 30px rgba(0,0,0,.06); overflow:hidden; width:100%;}
  .gantt{position:relative;}
  .axis{position:relative; height:40px; margin-left:var(--lw); border-bottom:1px solid var(--line); background:#f8fafc;}
  .clip-area{position:absolute; left:0; right:0; top:0; bottom:0; overflow:hidden;}
  .wk{position:absolute; top:12px; transform:translateX(-50%); font-size:.75rem; color:var(--mut);
      white-space:nowrap; font-weight:700; left:calc((var(--l) - var(--z-off)) * var(--z-scale) * 1%);
      transition:left .6s cubic-bezier(.4,0,.2,1);}

  .row{display:flex; align-items:center; min-height:48px; border-bottom:1px solid #f1f5f9;
       transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .4s ease, min-height .5s ease, background .2s;
       max-height:80px; overflow:hidden; opacity:0; transform:translateY(6px);}
  .row.in{opacity:1; transform:translateY(0); transition:max-height .5s cubic-bezier(.4,0,.2,1), min-height .5s ease,
          background .2s, opacity .45s ease, transform .45s ease;}
  .row:hover{background:#f8fafc;}
  .row:last-child{border-bottom:none;}
  .row.hidden-row{max-height:0; min-height:0; opacity:0; border-bottom:none; pointer-events:none;}

  .label{width:var(--lw); flex:0 0 var(--lw); padding:8px 16px; display:flex; align-items:center; gap:12px;
         font-size:.85rem; border-right:1px solid var(--line); font-weight:600; background:var(--panel); z-index:10;}
  .lname{flex:1; line-height:1.3; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dot{width:12px; height:12px; border-radius:50%; flex:0 0 12px;}

  .track{position:relative; flex:1; height:48px; overflow:hidden;}
  .gl{position:absolute; top:0; bottom:0; width:1px;
      background:repeating-linear-gradient(to bottom, transparent, transparent 4px, #e2e8f0 4px, #e2e8f0 8px);
      left:calc((var(--l) - var(--z-off)) * var(--z-scale) * 1%); transition:left .6s cubic-bezier(.4,0,.2,1); opacity:.5;}

  .bar{position:absolute; top:10px; height:26px; border-radius:6px; background-color:var(--c);
       display:flex; align-items:center; padding:0 10px; font-size:.70rem; color:#fff; font-weight:600;
       box-shadow:0 3px 8px rgba(0,0,0,.12); opacity:.95; overflow:hidden; white-space:nowrap; cursor:pointer;
       left:calc((var(--l) - var(--z-off)) * var(--z-scale) * 1%); width:calc(var(--w) * var(--z-scale) * 1%);
       min-width:4px;
       transition:left .6s cubic-bezier(.4,0,.2,1), width .6s cubic-bezier(.4,0,.2,1), transform .2s, box-shadow .2s, opacity .2s;}
  .bar:hover{opacity:1; transform:translateY(-2px); z-index:5; box-shadow:0 6px 12px rgba(0,0,0,.2);}
  .bar .bar-text{pointer-events:none;}
  .bar.text-hidden .bar-text{opacity:0;}

  .bar-ext-label{
    position:absolute; top:14px; font-size:.70rem; font-weight:700; white-space:nowrap;
    color:#334155; pointer-events:none; display:none;
    left:calc((var(--l) - var(--z-off)) * var(--z-scale) * 1%);
    transition:left .6s cubic-bezier(.4,0,.2,1);
  }
  .bar-ext-label.show{display:block;}

  #ganttTooltip{
    position:fixed; z-index:9999; pointer-events:none; background:#0f172a; color:#f8fafc; border-radius:10px;
    padding:12px 14px; font-size:.78rem; line-height:1.45; max-width:340px; box-shadow:0 12px 30px rgba(0,0,0,.28);
    opacity:0; transform:translateY(4px); transition:opacity .12s ease, transform .12s ease;
    border:1px solid rgba(255,255,255,.08);
  }
  #ganttTooltip.show{opacity:1; transform:translateY(0);}
  #ganttTooltip .tt-title{font-weight:700; font-size:.85rem; color:#fff; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
  #ganttTooltip .tt-dot{width:10px; height:10px; border-radius:50%; flex:0 0 10px;}
  #ganttTooltip .tt-row{display:flex; gap:6px; margin-top:3px;}
  #ganttTooltip .tt-label{color:#94a3b8; font-weight:600; flex:0 0 auto;}
  #ganttTooltip .tt-value{color:#f1f5f9; font-weight:500;}
  #ganttTooltip .tt-desc{margin-top:6px; color:#cbd5e1; font-weight:400;}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Cronograma COS Selection 2026</h1>
      <p>Dashboard Ejecutivo Consolidado</p>
    </div>
  </header>

  <div class="kpis">

    <div class="kpi dl"><div class="v" id="kpiEnd">—</div><div class="l">Finalización Estimada</div></div>

    <span class="leg" data-phase="f2" data-color="#0284c7"><i style="background:#0284c7"></i>Fase 2 · Desarrollo Core</span>
    <span class="leg" data-phase="f3" data-color="#d97706"><i style="background:#d97706"></i>Fase 3 · Infra & QA</span>

    <span id="resetBtn">↺ Ver Todo</span>
  </div>

  <div class="chart" id="ganttChart">
    <div class="gantt">
      <div class="axis">
        <div class="clip-area" id="axisTrack"></div>
      </div>
      <div style="position:relative">
        <div style="position:absolute; left:var(--lw); right:0; top:0; bottom:0; pointer-events:none;">
          <div class="clip-area" id="gridTrack"></div>
        </div>
        <div id="rowsContainer"></div>
      </div>
    </div>
  </div>
</div>

<div id="ganttTooltip"></div>

/* ---------- utilidades de fecha ---------- */
function parseDate(str){
  const [d,m,y] = str.split('/').map(Number);
  return Date.UTC(y, m-1, d);
}
function fmtShort(ms){
  const d = new Date(ms);
  const dd = String(d.getUTCDate()).padStart(2,'0');
  const mm = String(d.getUTCMonth()+1).padStart(2,'0');
  return `${dd}/${mm}`;
}
const DAY = 86400000;

/* ---------- construir dataset con posiciones calculadas ---------- */
const parsed = TASKS.map(([phase,name,start,end,resp,desc]) => ({
  phase, color: PHASE_COLORS[phase], name,
  startMs: parseDate(start), endMs: parseDate(end),
  start, end, resp, desc
}));

const PROJECT_START = Math.min(...parsed.map(t=>t.startMs));
const PROJECT_END   = Math.max(...parsed.map(t=>t.endMs));
const TOTAL_DAYS    = (PROJECT_END - PROJECT_START)/DAY;
const DAY_PCT       = 100/TOTAL_DAYS;

parsed.forEach(t=>{
  const startDay = (t.startMs - PROJECT_START)/DAY;
  const spanDays = Math.max((t.endMs - t.startMs)/DAY, 1);
  t.l = startDay * DAY_PCT;
  t.w = spanDays * DAY_PCT;
});

/* ---------- KPIs ---------- */
document.getElementById('kpiStart').textContent = fmtShort(PROJECT_START);
document.getElementById('kpiEnd').textContent = fmtShort(PROJECT_END);

/* ---------- render ejes (semanas) ---------- */
const axisTrack = document.getElementById('axisTrack');
const gridTrack = document.getElementById('gridTrack');
let axisHtml = '', gridHtml = '';
for(let d=0; d<=TOTAL_DAYS; d+=7){
  const l = (d*DAY_PCT).toFixed(2);
  const label = fmtShort(PROJECT_START + d*DAY);
  axisHtml += `<div class="wk" style="--l:${l}">${label}</div>`;
  gridHtml += `<div class="gl" style="--l:${l}"></div>`;
}
axisTrack.innerHTML = axisHtml;
gridTrack.innerHTML = gridHtml;

/* ---------- render filas ---------- */
const rowsContainer = document.getElementById('rowsContainer');
const escapeHtml = (s) => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let rowsHtml = '';
parsed.forEach((t, i) => {
  const shortLabel = t.start.slice(0,5) === t.end.slice(0,5) ? t.start.slice(0,5) : `${t.start.slice(0,5)}–${t.end.slice(0,5)}`;
  const fullRange = t.start === t.end ? t.start : `${t.start} – ${t.end}`;
  rowsHtml += `
    <div class="row" data-phase="${t.phase}" data-idx="${i}">
      <div class="label"><span class="dot" style="background:${t.color};"></span><span class="lname" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span></div>
      <div class="track">
        <div class="bar" style="--l:${t.l}; --w:${t.w}; --c:${t.color}"
             data-name="${escapeHtml(t.name)}" data-start="${t.start}" data-end="${t.end}"
             data-range="${escapeHtml(fullRange)}" data-resp="${escapeHtml(t.resp)}" data-desc="${escapeHtml(t.desc)}">
          <span class="bar-text">${shortLabel}</span>
        </div>
        <span class="bar-ext-label" style="--l:${t.l}"></span>
      </div>
    </div>`;
});
rowsContainer.innerHTML = rowsHtml;

/* ---------- animación de entrada escalonada ---------- */
const rows = Array.from(document.querySelectorAll('.row'));
rows.forEach((r, i) => {
  setTimeout(() => r.classList.add('in'), 12 * i);
});

/* ---------- ajuste de etiquetas fuera de la barra si no caben ---------- */
const measureCanvas = document.createElement('canvas');
const mctx = measureCanvas.getContext('2d');
mctx.font = '700 11px Inter, system-ui, sans-serif';

function layoutBarLabels(){
  document.querySelectorAll('.track').forEach(track => {
    const bar = track.querySelector('.bar');
    const extLabel = track.querySelector('.bar-ext-label');
    if(!bar || !extLabel) return;

    const trackWidth = track.clientWidth;
    const barText = bar.querySelector('.bar-text');
    const text = bar.getAttribute('data-start') === bar.getAttribute('data-end')
      ? bar.getAttribute('data-start').slice(0,5)
      : `${bar.getAttribute('data-start').slice(0,5)}–${bar.getAttribute('data-end').slice(0,5)}`;

    const barLeftPx = trackWidth * (parseFloat(bar.style.getPropertyValue('--l')) / 100);
    const barWidthPx = trackWidth * (parseFloat(bar.style.getPropertyValue('--w')) / 100);
    const zScale = parseFloat(getComputedStyle(track.closest('.chart')).getPropertyValue('--z-scale')) || 1;
    const zOff = parseFloat(getComputedStyle(track.closest('.chart')).getPropertyValue('--z-off')) || 0;
    const l = parseFloat(bar.style.getPropertyValue('--l'));
    const w = parseFloat(bar.style.getPropertyValue('--w'));
    const realLeftPx = trackWidth * ((l - zOff) * zScale / 100);
    const realWidthPx = trackWidth * (w * zScale / 100);

    const neededPx = mctx.measureText(text).width + 16;

    if(neededPx <= realWidthPx - 12){
      bar.classList.remove('text-hidden');
      extLabel.classList.remove('show');
      return;
    }

    bar.classList.add('text-hidden');
    extLabel.textContent = text;
    extLabel.style.color = bar.style.getPropertyValue('--c');

    const rightSpace = trackWidth - (realLeftPx + realWidthPx) - 8;
    if(rightSpace >= neededPx){
      extLabel.style.left = `calc((var(--l) - var(--z-off)) * var(--z-scale) * 1% + ${realWidthPx + 8}px)`;
      extLabel.style.right = 'auto';
    } else {
      extLabel.style.removeProperty('left');
      extLabel.style.setProperty('left', `calc((var(--l) - var(--z-off)) * var(--z-scale) * 1% - ${neededPx + 8}px)`);
    }
    extLabel.classList.add('show');
  });
}

/* recalcular tras cargar, al redimensionar, y tras animaciones de zoom */
window.addEventListener('load', layoutBarLabels);
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutBarLabels, 120); });
setTimeout(layoutBarLabels, 400);

/* =========================================================
   TOOLTIP
   ========================================================= */
const tooltip = document.getElementById('ganttTooltip');
function showTooltip(bar, evt){
  const name = bar.getAttribute('data-name') || '';
  const range = bar.getAttribute('data-range') || '';
  const resp = bar.getAttribute('data-resp') || '';
  const desc = bar.getAttribute('data-desc') || '';
  const color = bar.style.getPropertyValue('--c');

  tooltip.innerHTML = `
    <div class="tt-title"><span class="tt-dot" style="background:${color}"></span>${escapeHtml(name)}</div>
    <div class="tt-row"><span class="tt-label">📅 Fecha:</span><span class="tt-value">${escapeHtml(range)}</span></div>
    <div class="tt-row"><span class="tt-label">👤 Responsable:</span><span class="tt-value">${escapeHtml(resp)}</span></div>
    ${desc ? `<div class="tt-desc">${escapeHtml(desc)}</div>` : ''}
  `;
  tooltip.classList.add('show');
  positionTooltip(evt);
}
function positionTooltip(evt){
  const padding = 16;
  const r = tooltip.getBoundingClientRect();
  let x = evt.clientX + padding;
  let y = evt.clientY + padding;
  if(x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - padding;
  if(y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - padding;
  tooltip.style.left = `${Math.max(8,x)}px`;
  tooltip.style.top = `${Math.max(8,y)}px`;
}
function hideTooltip(){ tooltip.classList.remove('show'); }

document.addEventListener('mouseover', (e) => {
  const bar = e.target.closest('.bar');
  if(bar) showTooltip(bar, e);
});
document.addEventListener('mousemove', (e) => {
  const bar = e.target.closest('.bar');
  if(bar) positionTooltip(e);
});
document.addEventListener('mouseout', (e) => {
  if(e.target.closest('.bar')) hideTooltip();
});

/* =========================================================
   FILTRO POR FASE + ZOOM
   ========================================================= */
const chart = document.getElementById('ganttChart');
const legends = document.querySelectorAll('.leg');
const resetBtn = document.getElementById('resetBtn');
let activePhase = null;

function resetView(){
  activePhase = null;
  chart.style.setProperty('--z-off','0');
  chart.style.setProperty('--z-scale','1');
  resetBtn.style.display = 'none';
  legends.forEach(l=>{ l.style.opacity='1'; l.style.transform='scale(1)'; l.style.borderColor='var(--line)'; });
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('hidden-row'));
  setTimeout(layoutBarLabels, 650);
}

legends.forEach(leg=>{
  leg.addEventListener('click', () => {
    const phase = leg.getAttribute('data-phase');
    if(activePhase === phase){ resetView(); return; }
    activePhase = phase;
    resetBtn.style.display = 'inline-block';
    let minL = 100, maxL = 0;

    legends.forEach(l=>{
      if(l.getAttribute('data-phase') === phase){
        l.style.opacity='1'; l.style.transform='scale(1.02)'; l.style.borderColor = l.getAttribute('data-color');
      } else {
        l.style.opacity='0.4'; l.style.transform='scale(1)'; l.style.borderColor='transparent';
      }
    });

    document.querySelectorAll('.row').forEach(r=>{
      if(r.getAttribute('data-phase') === phase){
        r.classList.remove('hidden-row');
        const bar = r.querySelector('.bar');
        if(bar){
          const l = parseFloat(bar.style.getPropertyValue('--l'));
          const w = parseFloat(bar.style.getPropertyValue('--w'));
          if(l < minL) minL = l;
          if(l+w > maxL) maxL = l+w;
        }
      } else {
        r.classList.add('hidden-row');
      }
    });

    const zoomMin = Math.max(0, minL - 3);
    const zoomMax = Math.min(100, maxL + 3);
    const scale = 100/(zoomMax - zoomMin);
    chart.style.setProperty('--z-off', zoomMin);
    chart.style.setProperty('--z-scale', scale);
    setTimeout(layoutBarLabels, 650);
  });
});
resetBtn.addEventListener('click', resetView);
</script>
</body>
